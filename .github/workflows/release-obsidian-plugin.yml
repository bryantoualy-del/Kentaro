name: Release Obsidian plugin

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - main.js
      - styles.css
      - .github/workflows/release-obsidian-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          node -e "console.log('value=' + require('./manifest.json').version)" >> "$GITHUB_OUTPUT"
      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" main.js manifest.json styles.css \
              --title "$VERSION" \
              --notes "Kentaro Session Importer $VERSION — import local pour Obsidian mobile et ordinateur."
          fi
