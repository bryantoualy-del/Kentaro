name: Complete Kentaro turn damage tracking
on:
  push:
    paths:
      - '.github/workflows/apply-turn-damage-extra.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_turn_damage_extra.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Complete turn damage tracking"
          git push origin main
