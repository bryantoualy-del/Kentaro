name: Patch Kentaro ribbon damage labels
on:
  push:
    paths:
      - '.github/workflows/patch-ruban-degats.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_ribbon.py
      - run: |
          rm .github/scripts/patch_ribbon.py
          rm .github/workflows/patch-ruban-degats.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify Kentaro blade ribbon damage output"
          git push
