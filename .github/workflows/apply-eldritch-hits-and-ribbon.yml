name: Apply Eldritch Hits And Ribbon
on:
  push:
    paths:
      - '.github/workflows/apply-eldritch-hits-and-ribbon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_eldritch_hits_and_ribbon.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine ribbon states and Eldritch hit FX"
          git push
