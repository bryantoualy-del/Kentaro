name: Fix Kentaro concentration render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-conc-render.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_conc_render.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix concentration render crash"
          git push
