name: Apply Eclipse Cinematic
on:
  push:
    paths:
      - '.github/workflows/apply-eclipse-cinematic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_eclipse_cinematic.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add cinematic Eclipse Seal visual FX'
          git push
