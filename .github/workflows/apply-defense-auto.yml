name: Apply Kentaro defense auto damage
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-defense-auto.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_defense_auto.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Add automatic defense damage flow"
          git push origin main
