name: Apply Ribbon Tones
on:
  push:
    paths:
      - 'patch_ribbon_tones.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ribbon tones
        run: python patch_ribbon_tones.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Differentiate ribbon warning and failure states"
          git push
