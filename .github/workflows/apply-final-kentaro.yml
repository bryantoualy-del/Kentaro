name: Apply final Kentaro preview
on:
  push:
    paths:
      - .github/workflows/apply-final-kentaro.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved preview patch
        shell: bash
        run: |
          cat .github/patches/final_1.patch .github/patches/final_2.patch .github/patches/final_3.patch .github/patches/final_4.patch .github/patches/final_5.patch > /tmp/kentaro.patch
          git apply --check /tmp/kentaro.patch
          git apply /tmp/kentaro.patch
      - name: Commit final preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply approved final combat UI"
          git push
