name: Apply compact tablet layout
on:
  push:
    paths:
      - '.github/workflows/apply-compact-tablet.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git apply kentaro_compact.patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use compact tablet combat layout"
          git push