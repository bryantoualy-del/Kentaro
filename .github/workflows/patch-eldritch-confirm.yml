name: Patch Eldritch Blast confirmation
on:
  push:
    paths:
      - '.github/workflows/patch-eldritch-confirm.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-eldritch-confirm.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Require hit confirmation for Eldritch Blast rays"
          git push
