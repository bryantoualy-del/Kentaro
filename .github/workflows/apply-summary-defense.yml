name: Apply approved Kentaro preview
on:
  push:
    paths:
      - '.github/scripts/apply_summary_defense.py'
      - '.github/workflows/apply-summary-defense.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize current anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="actionUsed:false,actionKind:'',actionLabel:'',attackCount:0,bonusUsed:false,bonusLabel:'',bonusSpell:false,reactionUsed:false,reactionLabel:'',eldritchRun:null"
          new="actionUsed:false,actionKind:'',actionLabel:'',attackCount:0,bonusUsed:false,bonusLabel:'',bonusSpell:false,reactionUsed:false,reactionLabel:'',pendingHit:null,eldritchRun:null"
          if old in s:
              s=s.replace(old,new,1)
          old2="const a=q('#ecoAction'),b=q('#ecoBonus'),r=q('#ecoReaction'),tv=q('#turnEconomyView');if(!a)return;if(tv)tv.textContent=S.turn;"
          new2="const a=q('#ecoAction'),b=q('#ecoBonus'),r=q('#ecoReaction'),t=q('#turnEconomyView');if(!a)return;if(t)t.textContent=S.turn;"
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: python .github/scripts/apply_summary_defense.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add turn summary and automatic defense damage handling" || exit 0
          git push
