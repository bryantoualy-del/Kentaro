name: Apply Persistent Shroud Size Fix
on:
  push:
    paths:
      - 'patch_fix_persistent_shroud_size.py'
      - '.github/workflows/apply-fix-persistent-shroud-size.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python patch_fix_persistent_shroud_size.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix persistent Spirit Shroud full-screen FX'
          git push
