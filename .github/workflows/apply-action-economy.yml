name: Apply action economy
on:
  push:
    paths:
      - '.github/workflows/apply-action-economy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          def rep(a,b,n=1):
              global t
              if a not in t: raise SystemExit('ANCHOR NOT FOUND: '+a[:80])
              t=t.replace(a,b,n)

          rep(".target-card .row,.target-card .modebar{margin-top:9px}.target-card .statusbox,.target-card .seal-banner{margin-top:9px}", ".target-card .row,.target-card .modebar{margin-top:9px}.target-card .statusbox,.target-card .seal-banner{margin-top:9px}.turn-economy{display:grid;grid-template-columns:auto repeat(3,1fr) auto;gap:7px;align-items:stretch;margin-top:10px}.turn-label{display:flex;align-items:center;justify-content:center;min-width:78px;min-height:54px;padding:7px 10px;border:1px solid #5b4a35;border-radius:9px;background:linear-gradient(180deg,#201a13,#12100d);color:#f0c36d}.turn-next{min-height:54px;white-space:nowrap;padding:7px 14px;border-color:#6b5b38;background:linear-gradient(180deg,#3a3020,#211a11);color:#f0d08b;font-weight:bold}.eco{padding:7px 8px;border:1px solid #394154;border-radius:9px;background:#0c0e14;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;line-height:1.15}.eco b{display:block;font-size:13px;margin-bottom:4px;line-height:1}.eco.used{opacity:.55;border-color:#63404a}.eco.free{border-color:#42664f}button:disabled{opacity:.38;cursor:not-allowed;filter:saturate(.45)}")

          rep("@media(max-width:760px){.combat-layout", "@media(max-width:760px){.turn-economy{grid-template-columns:1fr 1fr}.turn-label{grid-column:1/-1}.turn-next{grid-column:1/-1}.combat-layout")

          rep('</section>\n\n<nav class="tabs">', '''</section>\n\n<div class="turn-economy">\n  <div class="turn-label"><b>Tour <span id="turnEconomyView">1</span></b></div>\n  <div id="ecoAction" class="eco free"><b>⚔ Action</b>Disponible</div>\n  <div id="ecoBonus" class="eco free"><b>✦ Bonus</b>Disponible</div>\n  <div id="ecoReaction" class="eco free"><b>↯ Réaction</b>Disponible</div>\n  <button id="newTurn" class="turn-next">↻ Nouveau tour</button>\n</div>\n\n<nav class="tabs">''')

          rep('<div class="modebar"><button id="curseToggle" class="toggle">☠ Malédiction OFF</button><button id="shroudToggle" class="toggle">◐ Voile spirituel OFF</button><button id="newTurn">↻ Nouveau tour</button></div>', '<div class="modebar"><button id="curseToggle" class="toggle">☠ Malédiction OFF</button><button id="shroudToggle" class="toggle">◐ Voile spirituel OFF</button></div>')

          rep("spectreActive:false,spectreHp:22,spectreTemp:5\n};", "spectreActive:false,spectreHp:22,spectreTemp:5,\n actionUsed:false,actionKind:'',actionLabel:'',attackCount:0,bonusUsed:false,bonusLabel:'',bonusSpell:false,reactionUsed:false,reactionLabel:''\n};")

          rep("function renderSlots(){", """function resetEconomy(){S.actionUsed=false;S.actionKind='';S.actionLabel='';S.attackCount=0;S.bonusUsed=false;S.bonusLabel='';S.bonusSpell=false;S.reactionUsed=false;S.reactionLabel=''}\nfunction useAttackAction(){if(S.actionUsed&&S.actionKind!=='attack'){log(`❌ Action déjà utilisée : ${S.actionLabel||S.actionKind}.`);return false}if(S.attackCount>=2){log('❌ Action d’attaque déjà complète : Kentaro a déjà effectué ses 2 attaques.');return false}if(!S.actionUsed){S.actionUsed=true;S.actionKind='attack';S.actionLabel='Attaquer'}S.attackCount++;return true}\nfunction useMainAction(label,kind='action'){if(S.actionUsed){log(`❌ Action déjà utilisée : ${S.actionLabel||S.actionKind}.`);return false}if(kind==='spell'&&S.bonusSpell){log('❌ Un sort a déjà été lancé en action bonus ce tour : seule une incantation mineure d’1 action reste autorisée.');return false}S.actionUsed=true;S.actionKind=kind;S.actionLabel=label;return true}\nfunction useBonusAction(label,isSpell=false){if(S.bonusUsed){log(`❌ Action bonus déjà utilisée : ${S.bonusLabel}.`);return false}if(isSpell&&S.actionUsed&&S.actionKind==='spell'){log('❌ Tu as déjà lancé un sort de niveau avec ton Action : impossible de lancer aussi un sort en action bonus ce tour.');return false}S.bonusUsed=true;S.bonusLabel=label;S.bonusSpell=isSpell;return true}\nfunction useReaction(label){if(S.reactionUsed){log(`❌ Réaction déjà utilisée : ${S.reactionLabel}.`);return false}S.reactionUsed=true;S.reactionLabel=label;return true}\nfunction renderEconomy(){const a=q('#ecoAction'),b=q('#ecoBonus'),r=q('#ecoReaction'),tv=q('#turnEconomyView');if(!a)return;if(tv)tv.textContent=S.turn;const actionTxt=S.actionUsed?(S.actionKind==='attack'?`${S.attackCount}/2 attaques`:(S.actionLabel||'Utilisée')):'Disponible';a.innerHTML=`<b>⚔ Action</b>${actionTxt}`;b.innerHTML=`<b>✦ Bonus</b>${S.bonusUsed?(S.bonusLabel||'Utilisée'):'Disponible'}`;r.innerHTML=`<b>↯ Réaction</b>${S.reactionUsed?(S.reactionLabel||'Utilisée'):'Disponible'}`;a.className='eco '+(S.actionUsed?'used':'free');b.className='eco '+(S.bonusUsed?'used':'free');r.className='eco '+(S.reactionUsed?'used':'free');const attackBlocked=(S.actionUsed&&S.actionKind!=='attack')||S.attackCount>=2;['solinar','solinarCrit','selhane','selhaneCrit'].forEach(id=>{const x=q('#'+id);if(x)x.disabled=attackBlocked});['thirdSmart','thirdSun','thirdMoon'].forEach(id=>{const x=q('#'+id);if(x)x.disabled=S.bonusUsed});const eb=q('#eldritch');if(eb)eb.disabled=!!S.actionUsed}\nfunction renderSlots(){""")

          rep(" renderSlots();renderRing()", " renderEconomy();renderSlots();renderRing()")
          rep("function blade(which,forceCrit=false){\n const sun=", "function blade(which,forceCrit=false,mode='action'){\n if(mode==='action'){if(!useAttackAction())return render()}else if(mode==='bonus'){if(!useBonusAction('3e attaque',false))return render()}\n const sun=")

          old="""function castSpellButton(b){\n if(!useSlot())return;const name=b.dataset.spell;if(b.dataset.conc)startConcentration(name);\n if(b.dataset.agathys){S.agathys=true;S.agathysDamage=25;setTempHp(25,\"Armure d’Agathys\")}\n render();log(`✨ ${name} lancé avec un emplacement de pacte N5${b.dataset.conc?' • concentration':''}${b.dataset.agathys?' • 25 PV temporaires':''}.`)\n}"""
          new="""function castSpellButton(b){\n const name=b.dataset.spell,bonus=['Maléfice','Foulée brumeuse','Voile spirituel'].includes(name);\n if(S.slots<1)return log('❌ Aucun emplacement de pacte restant.');\n if(bonus){if(!useBonusAction(name,true))return render()}else{if(!useMainAction(name,'spell'))return render()}\n if(!useSlot())return;if(b.dataset.conc)startConcentration(name);\n if(b.dataset.agathys){S.agathys=true;S.agathysDamage=25;setTempHp(25,\"Armure d’Agathys\")}\n render();log(`✨ ${name} lancé avec un emplacement de pacte N5 • ${bonus?'action bonus':'Action'}${b.dataset.conc?' • concentration':''}${b.dataset.agathys?' • 25 PV temporaires':''}.`)\n}"""
          rep(old,new)

          rep("q('#solinar').onclick=()=>blade('sun');q('#solinarCrit').onclick=()=>blade('sun',true);q('#selhane').onclick=()=>blade('moon');q('#selhaneCrit').onclick=()=>blade('moon',true);q('#thirdSun').onclick=()=>blade('sun');q('#thirdMoon').onclick=()=>blade('moon');q('#thirdSmart').onclick=()=>{if(!S.solHit)return blade('sun');if(!S.selHit)return blade('moon');blade('sun')};", "q('#solinar').onclick=()=>blade('sun');q('#solinarCrit').onclick=()=>blade('sun',true);q('#selhane').onclick=()=>blade('moon');q('#selhaneCrit').onclick=()=>blade('moon',true);q('#thirdSun').onclick=()=>blade('sun',false,'bonus');q('#thirdMoon').onclick=()=>blade('moon',false,'bonus');q('#thirdSmart').onclick=()=>{if(!S.solHit)return blade('sun',false,'bonus');if(!S.selHit)return blade('moon',false,'bonus');blade('sun',false,'bonus')};")

          rep("S.lastCrit=false;S.lastCritBlade='';if(S.sealTarget", "S.lastCrit=false;S.lastCritBlade='';resetEconomy();if(S.sealTarget")
          rep("log(`↻ Tour ${S.turn} : suivi des touches réinitialisé.`)", "log(`↻ Tour ${S.turn} : Action, action bonus et réaction restaurées • suivi des touches réinitialisé.`)")

          rep("q('#curseToggle').onclick=()=>{if(!S.curse&&!S.curseReady)return log('❌ Malédiction déjà utilisée depuis le dernier repos court.');if(!S.curse&&!cleanName(S.curseTarget))return log('❌ Renseigne d’abord le nom de la cible maudite.');push();S.curse=!S.curse;if(S.curse){S.curseReady=false;log(`☠ Malédiction activée sur ${S.curseTarget} : +4 dégâts et critique 19–20 uniquement contre cette cible.`)}else log('☠ Malédiction désactivée.');render()};", "q('#curseToggle').onclick=()=>{if(!S.curse&&!S.curseReady)return log('❌ Malédiction déjà utilisée depuis le dernier repos court.');if(!S.curse&&!cleanName(S.curseTarget))return log('❌ Renseigne d’abord le nom de la cible maudite.');if(!S.curse&&!useBonusAction('Malédiction',false))return render();push();S.curse=!S.curse;if(S.curse){S.curseReady=false;log(`☠ Malédiction activée sur ${S.curseTarget} : action bonus consommée • +4 dégâts et critique 19–20 uniquement contre cette cible.`)}else log('☠ Malédiction désactivée.');render()};")

          rep("q('#shroudToggle').onclick=()=>{push();if(!S.shroud){S.shroud=true;startConcentration('Voile spirituel');log('◐ Voile spirituel activé manuellement : +2d8 par touche.')}else{S.shroud=false;if(S.concSpell==='Voile spirituel'){S.conc=false;S.concSpell=''}log('◐ Voile spirituel désactivé.')}render()};", """q('#shroudToggle').onclick=()=>{if(!S.shroud){if(S.slots<1)return log('❌ Impossible d’activer Voile spirituel : aucun emplacement de pacte N5 restant.');if(!useBonusAction('Voile spirituel',true))return render();push();if(!useSlot())return render();S.shroud=true;startConcentration('Voile spirituel');render();log('◐ Voile spirituel activé : action bonus consommée • 1 emplacement de pacte N5 dépensé • concentration • +2d8 par touche.');}else{push();S.shroud=false;if(S.concSpell==='Voile spirituel'){S.conc=false;S.concSpell=''}render();log('◐ Voile spirituel désactivé. Aucun slot supplémentaire n’est consommé.');}};""")

          rep("q('#eldritch').onclick=()=>{fx('red');", "q('#eldritch').onclick=()=>{if(!useMainAction('Décharge occulte','cantrip'))return render();render();fx('red');")
          rep("q('#hexArmor').onclick=()=>{if(!S.curse||!cleanName(S.curseTarget))return log('❌ Aucune cible maudite active.');const x=d(6)", "q('#hexArmor').onclick=()=>{if(!S.curse||!cleanName(S.curseTarget))return log('❌ Aucune cible maudite active.');if(!useReaction('Armure des maléfices'))return render();render();const x=d(6)")
          rep("q('#lazarus').onclick=()=>{push();if(setTempHp", "q('#lazarus').onclick=()=>{if(!useReaction('Tombeau de Lazarus'))return render();push();render();if(setTempHp")
          rep("S.lastCrit=false;render();log('☕ Repos court", "S.lastCrit=false;resetEconomy();render();log('☕ Repos court")
          rep("spectreActive:false,spectreHp:22,spectreTemp:5});render();log('🌙 Repos long", "spectreActive:false,spectreHp:22,spectreTemp:5,actionUsed:false,actionKind:'',actionLabel:'',attackCount:0,bonusUsed:false,bonusLabel:'',bonusSpell:false,reactionUsed:false,reactionLabel:''});render();log('🌙 Repos long")
          rep("S.lastCrit=false;S.turn=1;render();log('⚔ Nouveau combat", "S.lastCrit=false;S.turn=1;resetEconomy();render();log('⚔ Nouveau combat")
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add turn action economy and slot-aware Spirit Shroud"
          git push
