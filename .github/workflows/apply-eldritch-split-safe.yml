name: Apply Eldritch Split Safe
on:
  push:
    paths:
      - 'patch_eldritch_split_safe.py'
      - '.github/workflows/apply-eldritch-split-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index
        run: python patch_eldritch_split_safe.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Add split-target Eldritch Blast FX"
          git push
