name: Apply Kentaro concentration and synaptic FX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-conc-synaptic-fx.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/apply_conc_synaptic_fx.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move concentration to turn bar and add Synaptic Static damage FX"
          git push
# retry-2
