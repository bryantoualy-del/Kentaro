name: Apply Kentaro combat cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-soif-combat-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/apply_soif_combat_cleanup.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Move Dark Thirst to combat and streamline defense"
          git push origin main
