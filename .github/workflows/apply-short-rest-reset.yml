name: Apply Short Rest Reset
on:
  push:
    paths:
      - 'patch_short_rest_reset.py'
      - '.github/workflows/apply-short-rest-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 patch_short_rest_reset.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reset combat data on short rest"
          git push
