name: Fix Eldritch Blast curse
on:
  push:
    paths:
      - '.github/workflows/fix-eldritch-curse.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Eldritch Blast curse interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old="q('#eldritch').onclick=()=>{fx('red');let lines=[],tot=0;for(let i=1;i<=2;i++){const rr=askNat(`Décharge occulte — rayon ${i}`,false);if(!rr)continue;const a=rr.nat+8,crit=rr.nat===20,hit=resolveHit(rr.nat,a,crit);if(hit){const r=roll(crit?2:1,10,4);tot+=r.total;lines.push(`Rayon ${i}: ${rr.detail}+8=${a} TOUCHÉ${crit?' CRITIQUE':''} • ${r.total} force`)}else lines.push(`Rayon ${i}: ${rr.detail}+8=${a} RATÉ`)}log(`🔴 Décharge occulte\\n${lines.join('\\n')}\\nTotal des rayons touchés : ${tot}`)};"
          new="q('#eldritch').onclick=()=>{fx('red');let lines=[],tot=0;const cursed=curseApplies();for(let i=1;i<=2;i++){const rr=askNat(`Décharge occulte — rayon ${i}`,false);if(!rr)continue;const a=rr.nat+8,crit=rr.nat===20||(cursed&&rr.nat===19),hit=resolveHit(rr.nat,a,crit);if(hit){const r=roll(crit?2:1,10,4+(cursed?4:0));tot+=r.total;lines.push(`Rayon ${i}: ${rr.detail}+8=${a} TOUCHÉ${crit?' CRITIQUE':''} • ${r.total} force${cursed?' (Malédiction +4)':''}`)}else lines.push(`Rayon ${i}: ${rr.detail}+8=${a} RATÉ`)}log(`🔴 Décharge occulte${cursed?' • cible maudite':''}\\n${lines.join('\\n')}\\nTotal des rayons touchés : ${tot}`)};"
          if old not in text:
              raise SystemExit('Eldritch Blast handler pattern not found')
          text=text.replace(old,new,1)
          text=text.replace('<div class="meta">Attaque à distance • +8 toucher • 2 rayons au niveau 10 • 1d10+4 force par rayon grâce à Décharge déchirante.</div>','<div class="meta">Attaque à distance • +8 toucher • 2 rayons au niveau 10 • 1d10+4 force par rayon grâce à Décharge déchirante • contre la cible maudite : +4 dégâts par rayon et critique sur 19–20.</div>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch and cleanup workflow
        run: |
          rm .github/workflows/fix-eldritch-curse.yml
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          git add index.html .github/workflows/fix-eldritch-curse.yml
          git commit -m "Apply Hexblade's Curse to Eldritch Blast"
          git push
