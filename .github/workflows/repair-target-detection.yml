name: Repair Kentaro target detection
on:
  push:
    paths:
      - .github/workflows/repair-target-detection.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        shell: bash
        run: |
          git show 7bbd761793b17cb27e292d96bca4f9dc1b4bfa94^:index.html > index.html
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Auto-detect same target for Eclipse Seal'
          git push
