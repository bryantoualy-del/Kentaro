name: Restore Previous Index
on:
  push:
    paths:
      - '.github/workflows/restore-previous-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous index
        run: python restore_previous_index.py
      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rollback last Kentaro index change"
          git push
