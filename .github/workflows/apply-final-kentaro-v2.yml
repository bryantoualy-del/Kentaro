name: Apply final Kentaro preview v2
on:
  push:
    paths:
      - .github/workflows/apply-final-kentaro-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps=[]
          reps.append(("#kentaro-ribbon .hint{margin-top:5px;color:#ddd4c5;font-size:11px}","#kentaro-ribbon .hint{margin-top:5px;color:#ddd4c5;font-size:11px}#kentaro-ribbon .ribbon-actions{display:none;gap:8px;margin-top:10px}#kentaro-ribbon.awaiting-hit .ribbon-actions{display:flex}#kentaro-ribbon.awaiting-hit .hint{display:none}#kentaro-ribbon .ribbon-actions button{flex:1;min-height:46px;font-weight:800;font-size:15px}"))
          reps.append(("#combatToolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.note-red{color:#ff9da9}.note-blue{color:#9ed0ff}",".utility-bar{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #303748}.utility-group{display:grid;gap:7px}.utility-rest{grid-template-columns:repeat(3,1fr)}.utility-tools{grid-template-columns:repeat(3,1fr)}.utility-bar button{width:100%;min-height:42px}.utility-rest button{background:linear-gradient(180deg,#24291f,#151a13);border-color:#4e6045}.utility-tools button{background:linear-gradient(180deg,#1c2029,#12151c)}.utility-danger{color:#d8a7af!important;border-color:#71404b!important}.save-status-compact{text-align:right;opacity:.72;margin-top:5px;font-size:11px}.note-red{color:#ff9da9}.note-blue{color:#9ed0ff}"))
          reps.append((".combat-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:12px;align-items:start}.target-stack{display:grid;gap:10px;position:sticky;top:92px}",".combat-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:12px;align-items:stretch}.target-stack{display:grid;gap:10px;position:sticky;top:92px;height:100%}.target-card{height:100%;display:flex;flex-direction:column}.target-card #sealStatus{margin-top:auto}"))
          reps.append(("@media(max-width:760px){.turn-economy{grid-template-columns:1fr 1fr}","@media(max-width:760px){.utility-bar{grid-template-columns:1fr}.utility-rest,.utility-tools{grid-template-columns:repeat(3,1fr)}.save-status-compact{text-align:center}.turn-economy{grid-template-columns:1fr 1fr}"))
          reps.append(('''      <div id="hitConfirm" class="statusbox" style="display:none">\n        <b id="hitConfirmText">Résultat à confirmer</b>\n        <div class="row"><button id="confirmHit" class="btn-green">✅ Touché</button><button id="confirmMiss" class="btn-red">❌ Raté</button></div>\n      </div>\n''',''))
          reps.append(('''<div class="footer-actions"><button id="shortRest">☕ Repos court</button><button id="longRest">🌙 Repos long</button><button id="resetSave">Effacer sauvegarde</button></div>\n<div id="saveStatus" class="meta" style="margin-top:8px">Sauvegarde locale : aucune modification enregistrée.</div>\n<div id="combatToolbar"><button id="undoLast">↶ Annuler dernière action</button><button id="toggleHistory">Historique</button><button id="newCombat">Nouveau combat</button></div>''','''<div class="utility-bar">\n  <div class="utility-group utility-rest">\n    <button id="shortRest">☕ Repos court</button>\n    <button id="longRest">🌙 Repos long</button>\n    <button id="newCombat">⚔ Nouveau combat</button>\n  </div>\n  <div class="utility-group utility-tools">\n    <button id="undoLast">↶ Annuler</button>\n    <button id="toggleHistory">Historique</button>\n    <button id="resetSave" class="utility-danger">Effacer sauvegarde</button>\n  </div>\n</div>\n<div id="saveStatus" class="meta save-status-compact">Sauvegarde locale : aucune modification enregistrée.</div>'''))
          reps.append(('<div id="kentaro-ribbon" role="status" aria-live="polite"><div class="title">Dernier résultat</div><div id="lastResult" class="body">Prêt. Que l’éclipse tombe.</div><div class="hint">Touchez pour fermer • disparition automatique après 7 s</div></div>','<div id="kentaro-ribbon" role="status" aria-live="polite"><div class="title">Dernier résultat</div><div id="lastResult" class="body">Prêt. Que l’éclipse tombe.</div><div id="ribbonHitActions" class="ribbon-actions"><button id="confirmHit" class="btn-green">✅ Touché</button><button id="confirmMiss" class="btn-red">❌ Raté</button></div><div class="hint">Touchez pour fermer • disparition automatique après 7 s</div></div>'))
          reps.append((" q('#lastResult').textContent=t;const r=q('#kentaro-ribbon');r.classList.add('show');clearTimeout(ribbonTimer);ribbonTimer=setTimeout(()=>r.classList.remove('show'),7000);save(true)"," q('#lastResult').textContent=t;const r=q('#kentaro-ribbon');r.classList.add('show');clearTimeout(ribbonTimer);if(!S.pendingHit)ribbonTimer=setTimeout(()=>r.classList.remove('show'),7000);save(true)"))
          reps.append((" const hc=q('#hitConfirm');if(hc){hc.style.display=S.pendingHit?'block':'none';if(S.pendingHit)q('#hitConfirmText').textContent=`🎯 ${S.pendingHit.name} — jet total ${S.pendingHit.total}. La CA est vide : touché ou raté ?`;}"," const rb=q('#kentaro-ribbon');if(rb)rb.classList.toggle('awaiting-hit',!!S.pendingHit);"))
          reps.append(("q('#confirmHit').onclick=()=>confirmPendingBlade(true);\nq('#confirmMiss').onclick=()=>confirmPendingBlade(false);","q('#confirmHit').onclick=(e)=>{e.stopPropagation();confirmPendingBlade(true)};\nq('#confirmMiss').onclick=(e)=>{e.stopPropagation();confirmPendingBlade(false)};"))
          reps.append(("q('#kentaro-ribbon').onclick=()=>q('#kentaro-ribbon').classList.remove('show');","q('#kentaro-ribbon').onclick=()=>{if(!S.pendingHit)q('#kentaro-ribbon').classList.remove('show')};"))
          for i,(a,b) in enumerate(reps,1):
              c=s.count(a)
              if c!=1:
                  raise SystemExit(f'replacement {i} expected 1 match, found {c}')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Verify final markers
        shell: bash
        run: |
          grep -q 'ribbonHitActions' index.html
          grep -q 'utility-bar' index.html
          grep -q 'align-items:stretch' index.html
          ! grep -q 'id="hitConfirm"' index.html
      - name: Commit final preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply approved final combat UI"
          git push
