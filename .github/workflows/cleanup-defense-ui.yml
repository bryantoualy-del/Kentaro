name: Clean Kentaro defense UI
on:
  push:
    paths:
      - '.github/workflows/cleanup-defense-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/cleanup_defense_ui.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Simplify defense and concentration UI"
          git push origin main
